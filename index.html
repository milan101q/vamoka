            model,
            config: {
              systemInstruction: SYSTEM_INSTRUCTION,
            },
            history: history.map(msg => ({
              role: msg.role,
              parts: [{ text: msg.text }]
            }))
          });

                        </div>
                        <div>
                            <h4 className="font-bold text-brand-900 text-xs uppercase tracking-widest mb-1">Custom Sizes</h4>
                            <p className="text-sm text-brand-700 leading-snug">We offer custom sizing to ensure the perfect fit for your unique wall space.</p>
                        </div>
                    </div>

                    <div className="flex items-start gap-4">
                        <div className="p-2 bg-white rounded-lg shadow-sm text-brand-600">
                          <Sparkles size={20} />
                        </div>
                        <div>
                            <h4 className="font-bold text-brand-900 text-xs uppercase tracking-widest mb-1">Beauty & Warmth</h4>
                            <p className="text-sm text-brand-700 leading-snug">Our mission is to bring beauty, warmth, and inspiration to your environment.</p>
                        </div>
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-4">
                    <a 
                      href="https://www.instagram.com/vamoka.artadventures/" 
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center gap-3 px-8 py-4 bg-brand-900 text-brand-50 hover:bg-brand-800 transition-colors uppercase tracking-widest text-sm font-bold shadow-lg hover:shadow-xl rounded-sm"
                    >
                      <Instagram size={18} />
                      Contact on Instagram
                    </a>
                    <a 
                      href="#gallery" 
                      onClick={scrollToGallery}
                      className="inline-flex items-center gap-3 px-8 py-4 bg-transparent border border-brand-900 text-brand-900 hover:bg-brand-100 transition-colors uppercase tracking-widest text-sm font-bold rounded-sm cursor-pointer"
                    >
                      View Gallery <ArrowRight size={18} />
                    </a>
                  </div>
                </div>

              </div>
            </div>
          </section>
        );
      };

      // --- COMPONENT: ChatAssistant ---
      const ChatAssistant = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [messages, setMessages] = useState([
          { role: 'model', text: "Hello! I'm your Art Curator AI. Tell me about your space or what inspires you, and I'll recommend a piece from the Vamoka collection." }
        ]);
        const [input, setInput] = useState('');
        const [chatState, setChatState] = useState(ChatState.IDLE);
        const messagesEndRef = useRef(null);

        const scrollToBottom = () => {
          messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        };

        useEffect(() => {
          if (isOpen) {
            scrollToBottom();
          }
        }, [messages, isOpen]);

        const handleSend = async (e) => {
          e.preventDefault();
          if (!input.trim() || chatState === ChatState.LOADING) return;

          const userMessage = { role: 'user', text: input };
          
          setMessages(prev => [...prev, userMessage]);
          setInput('');
          setChatState(ChatState.LOADING);

          try {
            const responseText = await sendMessageToGemini(messages, input);
            setMessages(prev => [...prev, { role: 'model', text: responseText }]);
            setChatState(ChatState.IDLE);
          } catch (error) {
            console.error("Chat Error:", error);
            setMessages(prev => [...prev, { role: 'model', text: "Sorry, I'm having trouble connecting to the art server right now.", isError: true }]);
            setChatState(ChatState.ERROR);
          }
        };

        return (
          <>
            <button
              onClick={() => setIsOpen(!isOpen)}
              className={`fixed bottom-6 right-6 z-50 p-4 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2 ${
                isOpen ? 'bg-brand-900 rotate-90 scale-0 opacity-0' : 'bg-brand-800 hover:bg-brand-700 text-white scale-100 opacity-100'
              }`}
            >
              <Sparkles size={24} />
            </button>

            <div 
              className={`fixed bottom-6 right-6 z-50 w-full max-w-[360px] bg-white rounded-2xl shadow-2xl border border-brand-100 flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right ${
                isOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none translate-y-10'
              }`}
              style={{ height: '500px', maxHeight: '80vh' }}
            >
              <div className="bg-brand-900 p-4 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <Sparkles className="text-brand-300" size={18} />
                  <div>
                    <h3 className="text-white font-medium text-sm tracking-wide">Art Curator AI</h3>
                    <p className="text-brand-300 text-xs">Powered by Gemini</p>
                  </div>
                </div>
                <button 
                  onClick={() => setIsOpen(false)}
                  className="text-brand-300 hover:text-white transition-colors"
                >
                  <X size={20} />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-brand-50">
                {messages.map((msg, idx) => (
                  <div 
                    key={idx} 
                    className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div 
                      className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                        msg.role === 'user' 
                          ? 'bg-brand-800 text-white rounded-br-none' 
                          : 'bg-white text-brand-900 border border-brand-100 rounded-bl-none shadow-sm'
                      } ${msg.isError ? 'bg-red-50 text-red-600 border-red-200' : ''}`}
                    >
                      {msg.text}
                    </div>
                  </div>
                ))}
                {chatState === ChatState.LOADING && (
                  <div className="flex justify-start">
                     <div className="bg-white text-brand-900 border border-brand-100 rounded-2xl rounded-bl-none shadow-sm px-4 py-3 flex items-center gap-2">
                       <Loader2 className="animate-spin text-brand-500" size={16} />
                       <span className="text-xs text-brand-500">Curating...</span>
                     </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              <form onSubmit={handleSend} className="p-4 bg-white border-t border-brand-100">
                <div className="relative">
                  <input
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    placeholder="Suggest something for a cozy bedroom..."
                    className="w-full pl-4 pr-12 py-3 bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm text-brand-900 placeholder-brand-400"
                    disabled={chatState === ChatState.LOADING}
                  />
                  <button
                    type="submit"
                    disabled={!input.trim() || chatState === ChatState.LOADING}
                    className="absolute right-2 top-1/2 transform -translate-y-1/2 p-2 text-brand-500 hover:text-brand-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                  >
                    <Send size={18} />
                  </button>
                </div>
              </form>
            </div>
          </>
        );
      };

      // --- COMPONENT: Footer ---
      const Footer = () => {
        return (
          <footer id="contact" className="bg-brand-900 text-brand-100 py-16">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row justify-between items-center mb-12">
                <div className="mb-8 md:mb-0 text-center md:text-left">
                  <h2 className="text-3xl font-serif text-white mb-2">Vamoka</h2>
                  <p className="text-brand-400 uppercase tracking-widest text-xs">Art Adventures</p>
                </div>
                
                <div className="flex space-x-8">
                  <a 
                    href="https://www.instagram.com/vamoka.artadventures/" 
                    target="_blank" 
                    rel="noreferrer"
                    className="text-brand-300 hover:text-white transition-colors p-2 hover:bg-brand-800 rounded-full"
                  >
                    <Instagram size={24} />
                  </a>
                </div>
              </div>
              
              <div className="border-t border-brand-800 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-brand-500">
                <p>&copy; {new Date().getFullYear()} Vamoka Art Adventures. All rights reserved.</p>
                <p className="flex items-center gap-1 mt-4 md:mt-0">
                  Made with <Heart size={14} className="text-red-400 fill-current" /> and Creative Spirit
                </p>
              </div>
            </div>
          </footer>
        );
      };

      // --- APP COMPONENT ---
      const App = () => {
        return (
          <div className="min-h-screen bg-brand-50">
            <Navbar />
            <main>
              <Hero />
              <Gallery />
              <About />
            </main>
            <Footer />
            <ChatAssistant />
          </div>
        );
      };

      // --- MOUNTING ---
      const rootElement = document.getElementById('root');
      const root = createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
