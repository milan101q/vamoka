    <!-- Error Boundary Script -->
    <script>
      window.addEventListener('error', function(e) {
        const root = document.getElementById('root');
        // Only show error if root is empty (app failed to mount)
        if (root && (!root.innerHTML || root.innerHTML === '')) {
           console.error("Global Error Caught:", e.error);
           const errorDiv = document.createElement('div');
           errorDiv.style.color = '#7f1d1d';
           errorDiv.style.padding = '20px';
           errorDiv.style.fontFamily = 'monospace';
           errorDiv.style.backgroundColor = '#fef2f2';
           errorDiv.style.border = '1px solid #fecaca';
           errorDiv.style.margin = '20px';
           errorDiv.style.borderRadius = '8px';
           errorDiv.innerHTML = '<h3>Application Error</h3><p>Please check the console for details.</p><pre>' + e.message + '</pre>';
           document.body.appendChild(errorDiv);
        }
      });
    </script>
